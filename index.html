<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Startpage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e7ddff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
    }

    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      width: 90%;
      max-width: 600px;
    }

    .card {
      display: block;
      padding: 20px;
      background-color: #ffffff;
      color: #967bb6;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      background-color: #967bb6;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <h2>森怡靜</h2>
  <h1>Personal Dashboard</h1>

  <div class="link-grid">
    <a href="https://mail.google.com" target="_blank" class="card">Gmail</a>
    <a href="https://drive.google.com" target="_blank" class="card">Google Drive</a>
    <a href="https://dtm.stu.edu.tw/index.php" target="_blank" class="card">School Portal</a>
    <a href="https://youtube.com" target="_blank" class="card">YouTube</a>
    <a href="https://github.com" target="_blank" class="card">GitHub</a>
    <a href="https://reddit.com" target="_blank" class="card">Reddit</a>
  </div>

</body>
</html>
